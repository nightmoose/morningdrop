version: '1.0'
name: shipments
description: Inferred by MorningDrop from 80 sample rows. Review before enforcing.
ontology:
  entities:
  - name: shipment_id
    type: string
    required: true
  - name: order_id
    type: string
    required: true
  - name: carrier
    type: string
    required: true
    enum:
    - DHL
    - UPS
    - USPS
  - name: shipped_on
    type: string
    required: true
    pattern: ^\d{4}-\d{2}-\d{2}$
  - name: weight_kg
    type: float
    required: true
    min: 0.28
    max: 8.78
  - name: signature_required
    type: boolean
    required: true
